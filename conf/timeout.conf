############################
## CONFIGURAZIONE TIMEOUT ##
############################

# termina perché finiscono i giorni (SIM_DURATION)
# pochi utenti, risorse abbondanti (nessun overload), durata breve

# 30 giorni simulati
SIM_DURATION = 2

# durata reale di un minuto simulato (in nanosecondi)
# es: 100ms reali = 1 minuto simulato -> 100000000
N_NANO_SECS = 100000000

# popolazione
NOF_USERS = 5
NOF_WORKERS = 10
NOF_TABLE_SEATS = 100

# utenti in attesa a fine giornata
OVERLOAD_THRESHOLD = 50

# tempi di servizio
AVG_SRVC_PRIMI = 1000
AVG_SRVC_MAIN_COURSE = 1000
AVG_SRVC_COFFEE = 1000
AVG_SRVC_CASSA = 1000

# capacità code (posti in piedi prima del servizio)
NOF_WK_SEATS_PRIMI = 50
NOF_WK_SEATS_SECONDI = 50
NOF_WK_SEATS_COFFEE = 50
NOF_WK_SEATS_CASSA = 50

# prezzi
PRICE_PRIMI = 5
PRICE_SECONDI = 8
PRICE_COFFEE = 1

# rifornimenti
AVG_REFILL_PRIMI = 10000
AVG_REFILL_SECONDI = 10000
MAX_PORZIONI_PRIMI = 500
MAX_PORZIONI_SECONDI = 500